name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime dependencies
        run: |
          pip install --upgrade pip
          pip install pptx-designer python-pptx Pillow

      - name: Validate metadata and Python sources
        run: |
          python scripts/check_metadata.py
          python -m py_compile install.py installer/install.py skill/scripts/check_runtime.py skill/scripts/inspect_pptx.py scripts/check_metadata.py
          python -m py_compile evals/001-chinese-enterprise-strategy/build.py evals/002-couture-editorial/build.py evals/003-scientific-research/build.py

      - name: Validate installer and runtime
        run: |
          # The runner has no LibreOffice/Poppler, so the PNG review gate cannot
          # run here; the unit tests below cover the strict render checking path.
          python installer/install.py --check --allow-missing-render
          python -m unittest tests.test_installer -v
